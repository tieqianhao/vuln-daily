name: daily

on:
  schedule:
    # UTC 23:00 = 北京时间每日 07:00
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch intel and generate daily report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python fetch_intel.py

      - name: Commit report and state
        run: |
          git config user.name "tieqianhao"
          git config user.email "tieqianhao@users.noreply.github.com"
          git add reports data
          if git diff --cached --quiet; then
            echo "今天没有需要提交的变更"
          else
            git commit -m "daily report $(date +%F)"
            git push
          fi
